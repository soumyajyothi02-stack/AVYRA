name: motionease
description: "AI-Powered Motion Sickness Relief Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^5.0.1
  flutter_tts: ^4.0.2
  speech_to_text: ^6.6.1
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  vibration: ^2.0.0
  fl_chart: ^0.66.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
